<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Venn Diagram</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f3f3;color:#222}
.header{max-width:1500px;margin:0 auto;padding:20px 24px 8px}
h1{margin:0;font-size:28px;text-align:center}
.subtitle{margin:6px 0 0;text-align:center;color:#666;font-size:14px}
.layout{max-width:1500px;margin:0 auto;padding:12px 24px 28px;display:grid;grid-template-columns:minmax(860px,1.4fr) minmax(340px,0.85fr);gap:22px;align-items:start}
.figure-card,.side-card{background:#fff;border:1px solid #dadada;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.figure-card{padding:20px 20px 8px;overflow:auto}
.side-card{padding:18px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.svg-wrap{min-width:980px}
.label{font-size:18px;font-weight:500;fill:#222}
.small{font-size:12px;fill:#666}
.count{font-size:16px;fill:#222;text-anchor:middle;pointer-events:none}
.region-hit{fill:rgba(0,0,0,.001);cursor:pointer}
.region-hit:hover,.region-hit.active{fill:rgba(30,30,30,.08);stroke:rgba(30,30,30,.25);stroke-width:1.5}
.panel-title{margin:0 0 8px;font-size:20px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f0f0f0;font-size:12px;color:#444;margin-bottom:10px}
.meta{color:#666;font-size:14px;margin-bottom:14px}
#summary{font-size:15px;line-height:1.45;margin-bottom:14px}
.search{width:100%;padding:10px 12px;border:1px solid #dadada;border-radius:10px;font-size:14px;margin-bottom:12px}
.list{border:1px solid #dadada;border-radius:12px;background:#fcfcfc;max-height:58vh;overflow:auto}
.item{padding:9px 12px;border-bottom:1px solid #ececec;font-size:14px;line-height:1.35}
.item:last-child{border-bottom:none}
.empty{padding:14px 12px;color:#666;font-size:14px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#444}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.12)}
button.reset{margin-top:12px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid #dadada;background:#f5f5f5;cursor:pointer;font-size:14px}
button.reset:hover{background:#ededed}
@media (max-width:1180px){.layout{grid-template-columns:1fr}.side-card{position:static;max-height:none}}
</style>
</head>

const summaryBox = document.getElementById('summary');
const list = document.getElementById('list');
const search = document.getElementById('search');
const hits = Array.from(document.querySelectorAll('.region-hit'));
function renderList(items){const q=search.value.trim().toLowerCase();const filtered=q?items.filter(x=>x.toLowerCase().includes(q)):items;if(!filtered.length){list.innerHTML='<div class="empty">No matches.</div>';return;}list.innerHTML=filtered.map(x=>'<div class="item">'+x+'</div>').join('');}

search.addEventListener('input',()=>{if(!current) return; renderList(vennData[current.cell].regions[current.region].metabolites);});
